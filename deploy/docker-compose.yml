# Plane app stack for VPS deploy (docker compose, not swarm).
# Images from GHCR via CI; secrets from `.env` next to this file ($DEPLOY_PATH).
#
# Required image env vars (set by CI before `docker compose up`):
#   WEB_IMAGE ADMIN_IMAGE SPACE_IMAGE LIVE_IMAGE API_IMAGE PROXY_IMAGE

services:
  web:
    container_name: web
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      - api

  admin:
    container_name: admin
    image: ${ADMIN_IMAGE}
    restart: unless-stopped
    depends_on:
      - api
      - web

  space:
    container_name: space
    image: ${SPACE_IMAGE}
    restart: unless-stopped
    depends_on:
      - api
      - web

  api:
    container_name: api
    image: ${API_IMAGE}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - .env
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq

  worker:
    container_name: bgworker
    image: ${API_IMAGE}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - .env
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  beat-worker:
    container_name: beatworker
    image: ${API_IMAGE}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - .env
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq

  migrator:
    container_name: plane-migrator
    image: ${API_IMAGE}
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - .env
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    image: ${LIVE_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
    depends_on:
      - api
      - plane-redis

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - uploads:/export

  proxy:
    container_name: proxy
    image: ${PROXY_IMAGE}
    restart: unless-stopped
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
      - "${LISTEN_HTTPS_PORT:-443}:443"
    env_file:
      - .env
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
    depends_on:
      - web
      - api
      - space
      - admin
      - live

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
