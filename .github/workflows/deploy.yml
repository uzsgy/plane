# Deploy production (manual). Preview auto-deploy khi push branch `preview`.
#
# Secrets: VPS + APP_ENV_PRODUCTION

name: Deploy

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch hoặc commit SHA
        type: string
        required: true
        default: prod
      image_tag:
        description: Tag image GHCR (hoặc commit SHA)
        type: string
        required: true
        default: production-candidate

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.out.outputs.sha }}
      image_prefix: ${{ steps.out.outputs.image_prefix }}
      image_tag: ${{ steps.out.outputs.image_tag }}
    steps:
      - name: Resolve ref
        id: ref
        run: |
          set -euo pipefail
          REF="${{ inputs.git_ref }}"
          : "${REF:?git_ref is required}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Resolve sha + image tag
        id: out
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          SHA="$(git rev-parse HEAD)"
          TAG="${{ inputs.image_tag }}"
          : "${TAG:?image_tag is required}"
          {
            echo "sha=$SHA"
            echo "image_prefix=${REGISTRY}/${repo}"
            echo "image_tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy production → ref=${{ steps.ref.outputs.ref }} sha=$SHA tag=$TAG"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Load secrets (VPS + APP_ENV_PRODUCTION)
        env:
          VPS: ${{ secrets.VPS }}
          APP_ENV: ${{ secrets.APP_ENV_PRODUCTION }}
        run: |
          set -euo pipefail
          : "${VPS:?Missing secret VPS}"
          : "${APP_ENV:?Missing secret APP_ENV_PRODUCTION}"
          printf '%s\n' "$VPS" > /tmp/vps.env
          printf '%s\n' "$APP_ENV" > /tmp/app.env
          python3 .github/scripts/split-vps-env.py /tmp/vps.env /tmp/vps
          python3 .github/scripts/split-deploy-env.py /tmp/app.env /tmp/split
      - name: Deploy stack (production)
        env:
          IMAGE_PREFIX: ${{ needs.resolve.outputs.image_prefix }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .github/scripts/ssh-with-vps.sh /tmp/vps
          DEPLOY_PATH="$(cat /tmp/split/deploy_path)"
          PREFIX="$IMAGE_PREFIX"
          TAG="$IMAGE_TAG"

          # Allow full image refs for one service, but normally tag is shared.
          case "$TAG" in
            ghcr.io/*/*/*:*)
              echo "Use a shared tag (sha / production-candidate / prod), not a full image ref" >&2
              exit 1
              ;;
          esac

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p $DEPLOY_PATH"
          scp -P "$VPS_PORT" deploy/docker-compose.yml "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/docker-compose.yml"
          scp -P "$VPS_PORT" /tmp/split/plane.env "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/.env"

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -euo pipefail
            echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_ACTOR --password-stdin
            cd $DEPLOY_PATH
            export WEB_IMAGE=${PREFIX}/web:${TAG}
            export ADMIN_IMAGE=${PREFIX}/admin:${TAG}
            export SPACE_IMAGE=${PREFIX}/space:${TAG}
            export LIVE_IMAGE=${PREFIX}/live:${TAG}
            export API_IMAGE=${PREFIX}/backend:${TAG}
            export PROXY_IMAGE=${PREFIX}/proxy:${TAG}
            docker compose pull
            docker compose run --rm migrator
            docker compose up -d --remove-orphans
            docker image prune -f
          "
