# Một workflow: push → build GHCR → deploy VPS ngay (preview + prod).
#
# Secrets:
#   VPS                  — SSH (host/user/port/private key)
#   APP_ENV_STAGING      — DEPLOY_PATH + Plane env (branch preview)
#   APP_ENV_PRODUCTION   — DEPLOY_PATH + Plane env (branch prod)

name: CI/CD

on:
  push:
    branches: [preview, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: Env để deploy
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      app_env_secret: ${{ steps.env.outputs.app_env_secret }}
      image_prefix: ${{ steps.env.outputs.image_prefix }}
      env_tag: ${{ steps.env.outputs.env_tag }}
    steps:
      - id: env
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image_prefix=${REGISTRY}/${repo}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_NAME="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "prod" ]; then
            ENV_NAME="production"
          else
            ENV_NAME="preview"
          fi

          echo "environment=$ENV_NAME" >> "$GITHUB_OUTPUT"
          if [ "$ENV_NAME" = "production" ]; then
            echo "app_env_secret=APP_ENV_PRODUCTION" >> "$GITHUB_OUTPUT"
            echo "env_tag=prod" >> "$GITHUB_OUTPUT"
          else
            echo "app_env_secret=APP_ENV_STAGING" >> "$GITHUB_OUTPUT"
            echo "env_tag=preview" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: apps/web/Dockerfile.web
          - name: admin
            context: .
            file: apps/admin/Dockerfile.admin
          - name: space
            context: .
            file: apps/space/Dockerfile.space
          - name: live
            context: .
            file: apps/live/Dockerfile.live
          - name: backend
            context: ./apps/api
            file: apps/api/Dockerfile.api
          - name: proxy
            context: ./apps/proxy
            file: apps/proxy/Dockerfile.ce
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          prefix="${{ needs.setup.outputs.image_prefix }}"
          name="${{ matrix.name }}"
          env_tag="${{ needs.setup.outputs.env_tag }}"
          echo "image=${prefix}/${name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "env_tag=${prefix}/${name}:${env_tag}" >> "$GITHUB_OUTPUT"
          echo "latest=${prefix}/${name}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.env_tag }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            VITE_API_BASE_URL=https://api.vngate.click
            VITE_WEB_BASE_URL=https://vngate.click
            VITE_ADMIN_BASE_URL=https://vngate.click
            VITE_ADMIN_BASE_PATH=/god-mode
            VITE_SPACE_BASE_URL=https://vngate.click
            VITE_SPACE_BASE_PATH=/spaces
            VITE_LIVE_BASE_URL=https://vngate.click
            VITE_LIVE_BASE_PATH=/live
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [setup, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load secrets
        env:
          VPS: ${{ secrets.VPS }}
          APP_ENV_STAGING: ${{ secrets.APP_ENV_STAGING }}
          APP_ENV_PRODUCTION: ${{ secrets.APP_ENV_PRODUCTION }}
          APP_ENV_SECRET: ${{ needs.setup.outputs.app_env_secret }}
        run: |
          set -euo pipefail
          : "${VPS:?Missing secret VPS}"
          if [ "$APP_ENV_SECRET" = "APP_ENV_PRODUCTION" ]; then
            APP_ENV="$APP_ENV_PRODUCTION"
            : "${APP_ENV:?Missing secret APP_ENV_PRODUCTION}"
          else
            APP_ENV="$APP_ENV_STAGING"
            : "${APP_ENV:?Missing secret APP_ENV_STAGING}"
          fi
          printf '%s\n' "$VPS" > /tmp/vps.env
          printf '%s\n' "$APP_ENV" > /tmp/app.env
          python3 .github/scripts/split-vps-env.py /tmp/vps.env /tmp/vps
          python3 .github/scripts/split-deploy-env.py /tmp/app.env /tmp/split
      - name: Deploy stack
        env:
          IMAGE_PREFIX: ${{ needs.setup.outputs.image_prefix }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .github/scripts/ssh-with-vps.sh /tmp/vps
          DEPLOY_PATH="$(cat /tmp/split/deploy_path)"
          PREFIX="$IMAGE_PREFIX"
          SHA="$GITHUB_SHA"

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p $DEPLOY_PATH"
          scp -P "$VPS_PORT" deploy/docker-compose.yml "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/docker-compose.yml"
          scp -P "$VPS_PORT" /tmp/split/plane.env "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/.env"

          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -euo pipefail
            echo $GHCR_TOKEN | docker login ghcr.io -u $GHCR_ACTOR --password-stdin
            cd $DEPLOY_PATH
            export WEB_IMAGE=${PREFIX}/web:${SHA}
            export ADMIN_IMAGE=${PREFIX}/admin:${SHA}
            export SPACE_IMAGE=${PREFIX}/space:${SHA}
            export LIVE_IMAGE=${PREFIX}/live:${SHA}
            export API_IMAGE=${PREFIX}/backend:${SHA}
            export PROXY_IMAGE=${PREFIX}/proxy:${SHA}
            docker compose pull
            docker compose run --rm migrator
            docker compose up -d --remove-orphans
            docker image prune -f
          "
